<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RentFlow – Login</title>

    <link rel="stylesheet" href="../css/signup.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="../css/light-theme.css" />
</head>
<body>
    <script src="../js/theme.js"></script>


    <video class="bg-video" autoplay muted loop playsinline>
        <source src="../assets/video.mp4" type="video/mp4">
    </video>

    <div id="container">

        <header class="logo" style="text-align: center; color: #B0AEAD;">Rent<span>Flow</span></header>
    <br>
    <h1 class="title" style="text-align: center;">Create your account</h1>
    <p class="subtitle" style="text-align: center;">Start renting smarter with RentFlow.</p>
    <br>

        <div class="input-field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
        </div>

        <div class="input-field"><label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <!-- <div >
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms" class="terms-label">
            I agree to the <a href="#" class="link" >Terms &amp; Conditions</a>
            </label>
            <span id="terms-error" class="error-msg"></span>
        </div> -->

         <button
    type="button"
    id="signup-submit"
    class="btn primary-btn"
    onclick="handleLogin()"
    style="background-color: #1b2540; color: white;"
>
    Log In
</button>

<div class="divider">
    <span>OR</span>
</div>

<div id="google-btn" class="google-login-container"></div>

<p class="login-link">
    Don't have an account?
    <a href="signup.html" class="link">Sign Up</a>
</p>

    </div>




<script src="../js/navbar-scroll.js"></script>
</body>
</html>

<script src="../js/login.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
